name: RozgarPK Automated Government Scraper & Email Alert Pipeline

on:
  schedule:
    # Runs automatically every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch:
    # Allows on-demand execution via GitHub UI

jobs:
  run-pipeline:
    name: Execute Government Portals Scraper & Email Ingestion
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Execute Scraper Pipeline & Email Alert Dispatcher
        run: node pipeline/run-test.js
        env:
          NODE_ENV: production
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
