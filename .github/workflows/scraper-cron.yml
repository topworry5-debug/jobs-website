name: Tainaati Automated Government Scraper Pipeline

on:
  schedule:
    # Runs automatically every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run only (scrape and validate without committing data)'
        required: false
        type: boolean
        default: false

concurrency:
  group: scraper-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape-and-sync:
    name: Execute Government Portals Scraper & Ingestion
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Execute Scraper Pipeline
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            node pipeline/sync-to-frontend.js --dry-run
          else
            node pipeline/sync-to-frontend.js
          fi
        env:
          NODE_ENV: production

      - name: Commit and Push Updated Scraped Jobs
        if: github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain src/data/liveScrapedJobs.json)" ]; then
            echo "Changes detected in src/data/liveScrapedJobs.json. Committing..."
            git add src/data/liveScrapedJobs.json
            git commit -m "chore(data): update scraped jobs"
            git pull --rebase origin main
            git push origin HEAD
            echo "COMMITTED=true" >> $GITHUB_ENV
          else
            echo "No changes in src/data/liveScrapedJobs.json. Working tree clean."
            echo "COMMITTED=false" >> $GITHUB_ENV
          fi

      - name: Trigger Vercel Deploy Hook
        if: env.COMMITTED == 'true' && env.VERCEL_DEPLOY_HOOK_URL != ''
        run: |
          echo "Triggering Vercel deployment hook..."
          curl -s -X POST "$VERCEL_DEPLOY_HOOK_URL"

      - name: Pipeline Execution Summary
        if: always()
        run: |
          echo "=========================================="
          echo "TAINAATI SCRAPER PIPELINE EXECUTION SUMMARY"
          echo "=========================================="
          echo "Sources reached: ${SOURCES_REACHED:-N/A}"
          echo "Jobs found:      ${JOBS_FOUND:-N/A}"
          echo "New jobs:        ${NEW_JOBS:-N/A}"
          echo "Archived:        ${ARCHIVED_JOBS:-N/A}"
          echo "Committed:       ${COMMITTED:-false}"
          echo "Workflow status: ${{ job.status }}"
          echo "=========================================="
          if [ -n "$GITHUB_STEP_SUMMARY" ]; then
            echo "### Tainaati Scraper Pipeline Summary" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Status**: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Sources Reached**: ${SOURCES_REACHED:-N/A}" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Jobs Found**: ${JOBS_FOUND:-N/A}" >> "$GITHUB_STEP_SUMMARY"
            echo "- **New Jobs**: ${NEW_JOBS:-N/A}" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Archived**: ${ARCHIVED_JOBS:-N/A}" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Committed to Repo**: ${COMMITTED:-false}" >> "$GITHUB_STEP_SUMMARY"
          fi
